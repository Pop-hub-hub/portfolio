<div
  class="floating-social-container"
  [ngClass]="{ expanded: isExpanded }"
  (mousedown)="startDrag($event)"
  (touchstart)="startDrag($event)"
  (mouseenter)="expandSocialLinks()"
  (mouseleave)="collapseSocialLinks()"
>
  <div
    class="floating-button"
    (click)="toggleSocialLinks()"
    (touchstart)="onButtonTouchStart($event)"
    tabindex="0"
    (keydown.enter)="toggleSocialLinks()"
    (keydown.space)="toggleSocialLinks()"
  >
    <svg
      *ngIf="!isExpanded"
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path
        d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"
      ></path>
    </svg>
    <svg
      *ngIf="isExpanded"
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </div>

  <div class="social-links-container">
    <a
      href="https://github.com/Pop-hub-hub"
      target="_blank"
      class="social-link"
      aria-label="GitHub"
      (click)="onSocialLinkClick($event)"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"
        ></path>
      </svg>
    </a>
    <a
      href="https://www.linkedin.com/in/abdalrhman-mostafa12"
      target="_blank"
      class="social-link"
      aria-label="LinkedIn"
      (click)="onSocialLinkClick($event)"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"
        ></path>
        <rect x="2" y="9" width="4" height="12"></rect>
        <circle cx="4" cy="4" r="2"></circle>
      </svg>
    </a>
    <a
      href="https://wa.me/201080631972"
      class="social-link"
      aria-label="WhatsApp"
      target="_blank"
      (click)="onSocialLinkClick($event)"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="currentColor"
      >
        <path
          d="M20.52 3.48A11.77 11.77 0 0 0 12 0C5.37 0 .01 5.37.01 12c0 2.12.55 4.18 1.59 6.01L0 24l6.2-1.63A11.9 11.9 0 0 0 12 24c6.63 0 12-5.37 12-12 0-3.19-1.24-6.19-3.48-8.52zM12 21.82c-1.88 0-3.71-.5-5.3-1.45l-.38-.22-3.68.97.98-3.59-.25-.37A9.8 9.8 0 0 1 2.18 12c0-5.42 4.4-9.82 9.82-9.82 2.62 0 5.08 1.02 6.94 2.88a9.78 9.78 0 0 1 2.88 6.94c0 5.42-4.4 9.82-9.82 9.82zm5.39-7.49c-.29-.15-1.7-.84-1.96-.94-.26-.1-.45-.15-.64.15s-.73.94-.9 1.13c-.17.19-.34.21-.63.06-.29-.15-1.22-.45-2.33-1.44-.86-.76-1.44-1.7-1.61-1.99-.17-.29-.02-.45.13-.6.14-.14.29-.34.43-.51.14-.17.19-.29.29-.48.1-.19.05-.36-.03-.51-.08-.15-.64-1.55-.88-2.12-.23-.56-.47-.49-.64-.5h-.55c-.19 0-.5.07-.76.36s-1 1-1 2.42 1.03 2.81 1.17 3c.14.19 2.03 3.11 4.92 4.36.69.3 1.23.48 1.65.61.69.22 1.32.19 1.82.12.56-.08 1.7-.7 1.94-1.38.24-.68.24-1.26.17-1.38-.07-.12-.26-.19-.55-.34z"
        />
      </svg>
    </a>
  </div>
</div>
